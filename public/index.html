<!doctype html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <script>
      // The game UI needs roughly 900 CSS px of width (it is laid out in rem).
      // On narrower screens render at 900 px and let the browser scale it to fit.
      (function () {
        try {
          var vw = Math.min(screen.width, window.innerWidth || screen.width);
          if (vw < 900) {
            document.querySelector('meta[name=viewport]').setAttribute(
              'content', 'width=900, initial-scale=' + (vw / 900) + ', viewport-fit=cover');
          }
        } catch (e) {}
      })();
    </script>
    <script>
      // Auto-fit: on narrow screens, shrink whichever tab is open so that it never
      // exceeds the available width (works for any tab, including future additions).
      // Reset + measure + set happen in one task, so there is no visible flicker.
      setInterval(function () {
        try {
          var el = document.querySelector('.c-game-tab');
          if (!el) return;
          el.style.zoom = '';
          if (window.innerWidth >= 1100) return;
          var sb = document.querySelector('.c-modern-sidebar');
          var avail = document.documentElement.clientWidth - (sb ? sb.offsetWidth : 0) - 8;
          var need = Math.max(el.scrollWidth, el.offsetWidth);
          if (need > avail) el.style.zoom = Math.max(0.4, avail / need);
        } catch (e) {}
      }, 400);
    </script>
    <script>
      // Touch hotkey bar: replaces the keyboard on phones. Buttons can be HELD
      // (they send keydown on press and keyup on release, like a real key), and
      // "Shift" is sticky. Works through the game's own Mousetrap bindings.
      (function () {
        var touch = false;
        try { touch = (window.matchMedia && matchMedia('(pointer: coarse)').matches) || 'ontouchstart' in window; } catch (e) {}
        if (!touch) return;

        var CODES = { shift: 16 };
        function codeOf(k) { return CODES[k] || k.toUpperCase().charCodeAt(0); }
        function fire(type, k, shift) {
          var kc = codeOf(k);
          var ev = new KeyboardEvent(type, {
            key: shift && k.length === 1 ? k.toUpperCase() : k, bubbles: true, cancelable: true,
            shiftKey: !!shift || k === 'shift'
          });
          var ch = type === 'keypress' ? k.charCodeAt(0) : kc;
          Object.defineProperty(ev, 'keyCode', { get: function () { return ch; } });
          Object.defineProperty(ev, 'which', { get: function () { return ch; } });
          Object.defineProperty(ev, 'charCode', { get: function () { return type === 'keypress' ? ch : 0; } });
          document.body.dispatchEvent(ev);
        }

        var shiftOn = false;
        var keys = ['M','1','2','3','4','5','6','7','8','T','D','G','S','C','R','E','L','Y','B','A'];

        function build() {
          if (!document.body || document.getElementById('mkbar')) return;
          var css = document.createElement('style');
          css.textContent =
            '#mkbar{position:fixed;left:0;right:0;bottom:0;z-index:2147483000;display:flex;gap:6px;padding:6px 8px;' +
            'background:rgba(8,16,28,.92);border-top:2px solid #2a6f9a;overflow-x:auto;-webkit-overflow-scrolling:touch;' +
            'touch-action:pan-x;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}' +
            '#mkbar button{flex:0 0 auto;min-width:54px;height:46px;font:bold 20px sans-serif;color:#dff;background:#17435f;' +
            'border:2px solid #3b8fc0;border-radius:8px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-x}' +
            '#mkbar button.on,#mkbar button:active{background:#2fa0d8;color:#012}' +
            '#mkbar.mk-off button:not(.mk-toggle){display:none}#mkbar.mk-off{width:auto;right:auto;padding:4px;overflow:visible}' +
            'body.mk-pad{padding-bottom:62px}' +
            // stop long-press text/block selection and the context menu on game controls
            '#ui-container,#ui-container *{-webkit-touch-callout:none}' +
            '#ui-container *:not(input):not(textarea):not([contenteditable]){-webkit-user-select:none;user-select:none}';
          document.head.appendChild(css);

          var bar = document.createElement('div');
          bar.id = 'mkbar';
          var off = false;
          try { off = localStorage.getItem('mkbar-off') === '1'; } catch (e) {}

          function apply() {
            bar.classList.toggle('mk-off', off);
            document.body.classList.toggle('mk-pad', !off);
          }

          var tg = document.createElement('button');
          tg.className = 'mk-toggle';
          tg.textContent = '⌨';
          tg.addEventListener('click', function () {
            off = !off;
            try { localStorage.setItem('mkbar-off', off ? '1' : '0'); } catch (e) {}
            apply();
          });
          bar.appendChild(tg);

          var sh = document.createElement('button');
          sh.textContent = 'Shift';
          sh.addEventListener('click', function () {
            shiftOn = !shiftOn;
            sh.classList.toggle('on', shiftOn);
            fire(shiftOn ? 'keydown' : 'keyup', 'shift', false);
          });
          bar.appendChild(sh);

          keys.forEach(function (label) {
            var k = label.toLowerCase();
            var b = document.createElement('button');
            b.textContent = label;
            var held = false;
            function down(e) {
              e.preventDefault();
              if (held) return;
              held = true;
              try { b.setPointerCapture(e.pointerId); } catch (x) {}
              fire('keydown', k, shiftOn);
              fire('keypress', k, shiftOn);
            }
            function up(e) {
              if (!held) return;
              held = false;
              fire('keyup', k, shiftOn);
            }
            b.addEventListener('pointerdown', down);
            b.addEventListener('pointerup', up);
            b.addEventListener('pointercancel', up);
            b.addEventListener('lostpointercapture', up);
            b.addEventListener('contextmenu', function (e) { e.preventDefault(); });
            bar.appendChild(b);
          });

          document.body.appendChild(bar);
          apply();
        }

        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', build);
        else build();
      })();
    </script>
    <style>html,body{-webkit-text-size-adjust:none;text-size-adjust:none;overflow-x:hidden}</style>

<script>
  // We use an IE only document variable to check here to force it to show the browser warning.
  // For some reason, IE really does *not* want to cooperate, even when you have a file as a <script> that you load
  // in the body.
  // Other browsers will be checked whenever window.onload is ran.
  if (document.documentMode) {
    document.getElementById("loading").style.display = "none";
    document.getElementById("browser-warning").style.display = "flex";
  }
</script>
<script>
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {

      navigator.serviceWorker.register("sw.js").catch(function () {});
