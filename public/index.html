<!doctype html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <script>
      // The game UI needs roughly 900 CSS px of width (it is laid out in rem).
      // On narrower screens render at 900 px and let the browser scale it to fit.
      (function () {
        try {
          var vw = Math.min(screen.width, window.innerWidth || screen.width);
          if (vw < 900) {
            document.querySelector('meta[name=viewport]').setAttribute(
              'content', 'width=900, initial-scale=' + (vw / 900) + ', viewport-fit=cover');
          }
        } catch (e) {}
      })();
    </script>
    <script>
      // Auto-fit: on narrow screens, shrink whichever tab is open so that it never
      // exceeds the available width (works for any tab, including future additions).
      // Reset + measure + set happen in one task, so there is no visible flicker.
      var fitKey = '', fitTick = 0;
      function fitTab() {
        try {
          var el = document.querySelector('.c-game-tab');
          if (!el) return;
          if (window.innerWidth >= 1100) { if (el.style.zoom) el.style.zoom = ''; return; }
          // Re-measure only when the tab/size changed, plus every ~4 s in case content grew (not every tick).
          var key = (window.ui && ui.view ? ui.view.tab + '/' + ui.view.subtab : '') + '|' + window.innerWidth;
          fitTick++;
          if (key === fitKey && fitTick % 10 !== 0) return;
          fitKey = key;
          el.style.zoom = '';
          var sb = document.querySelector('.c-modern-sidebar');
          var avail = document.documentElement.clientWidth - (sb ? sb.offsetWidth : 0) - 8;
          var need = Math.max(el.scrollWidth, el.offsetWidth);
          if (need > avail) el.style.zoom = Math.max(0.4, avail / need);
        } catch (e) {}
      }
      setInterval(fitTab, 400);
      setTimeout(fitTab, 100);
    </script>
    <script>
      // Touch hotkey bar: 6 configurable big buttons + a gear button to configure them.
      // Single tap = one press. Double tap = hold (latched) until the next tap.
      // Keys go through the game's own Mousetrap bindings as synthetic key events.
      (function () {
        var touch = false;
        try { touch = (window.matchMedia && matchMedia('(pointer: coarse)').matches) || 'ontouchstart' in window; } catch (e) {}
        if (!touch) return;

        var KEYS = ['M','1','2','3','4','5','6','7','8','T','D','G','S','C','R','E','L','Y','B','A','O','V','N','Z','U'];
        var DEFAULTS = [
          { k: 'M', s: false }, { k: 'D', s: false }, { k: 'G', s: false },
          { k: 'T', s: false }, { k: 'S', s: false }, { k: 'C', s: false }
        ];
        var cfg = DEFAULTS;
        try {
          var saved = JSON.parse(localStorage.getItem('mkbar-cfg2'));
          if (Array.isArray(saved) && saved.length === 6) cfg = saved;
        } catch (e) {}
        function save() { try { localStorage.setItem('mkbar-cfg2', JSON.stringify(cfg)); } catch (e) {} }

        function fire(type, k, shift) {
          var ch = k === 'shift' ? 16 : (type === 'keypress' ? k.charCodeAt(0) : k.toUpperCase().charCodeAt(0));
          var ev = new KeyboardEvent(type, {
            key: shift && k.length === 1 ? k.toUpperCase() : k, bubbles: true, cancelable: true,
            shiftKey: !!shift || k === 'shift'
          });
          Object.defineProperty(ev, 'keyCode', { get: function () { return ch; } });
          Object.defineProperty(ev, 'which', { get: function () { return ch; } });
          Object.defineProperty(ev, 'charCode', { get: function () { return type === 'keypress' ? ch : 0; } });
          document.body.dispatchEvent(ev);
        }
        function down(k, s, withPress) {
          if (s) fire('keydown', 'shift', false);
          fire('keydown', k, s);
          if (withPress) fire('keypress', k, s);
        }
        function up(k, s) {
          fire('keyup', k, s);
          if (s) fire('keyup', 'shift', false);
        }

        function build() {
          if (!document.body || document.getElementById('mkbar')) return;
          var css = document.createElement('style');
          css.textContent =
            '#mkbar{position:fixed;left:0;right:0;bottom:0;z-index:2147483000;display:flex;gap:10px;padding:10px;' +
            'background:rgba(8,16,28,.92);border-top:2px solid #2a6f9a;touch-action:manipulation;' +
            'user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}' +
            '#mkbar button{flex:1 1 0;min-width:0;height:92px;font:bold 38px sans-serif;color:#dff;background:#17435f;' +
            'border:3px solid #3b8fc0;border-radius:14px;padding:0;user-select:none;-webkit-user-select:none;' +
            '-webkit-touch-callout:none;touch-action:manipulation}' +
            '#mkbar button small{display:block;font-size:16px;font-weight:normal;opacity:.8}' +
            '#mkbar button.on{background:#e8a317;color:#210;border-color:#ffd36a}' +
            '#mkbar button:active{background:#2fa0d8;color:#012}' +
            '#mkbar button.mk-gear{flex:0 0 92px;background:#2b3340;border-color:#6b7787}' +
            '#mkcfg{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);z-index:2147483001;width:520px;max-width:96vw;' +
            'background:#0b1622;border:3px solid #3b8fc0;border-radius:14px;padding:16px;color:#dff;font:24px sans-serif}' +
            '#mkcfg .row{display:flex;align-items:center;gap:14px;margin:10px 0}' +
            '#mkcfg select{font-size:26px;padding:6px;background:#17435f;color:#dff;border:2px solid #3b8fc0;border-radius:8px}' +
            '#mkcfg label{display:flex;align-items:center;gap:6px}' +
            '#mkcfg input[type=checkbox]{width:28px;height:28px}' +
            '#mkcfg .done{width:100%;height:60px;font-size:28px;background:#2fa0d8;color:#012;border:0;border-radius:10px;margin-top:8px}' +
            'body.mk-pad{padding-bottom:125px}' +
            // the game scrolls inside #ui, not the page: add a spacer at the end of that scroller
            'body.mk-pad .tab-container{padding-bottom:140px}' +
            '#ui-container,#ui-container *{-webkit-touch-callout:none}' +
            '#ui-container *:not(input):not(textarea):not([contenteditable]){-webkit-user-select:none;user-select:none}';
          document.head.appendChild(css);

          var bar = document.createElement('div');
          bar.id = 'mkbar';
          var btns = [];
          var latched = [false, false, false, false, false, false];
          var lastTap = [0, 0, 0, 0, 0, 0];

          function label(i) {
            var c = cfg[i];
            return (c.s ? '⇧' : '') + c.k;
          }
          function refresh() {
            for (var i = 0; i < 6; i++) {
              btns[i].textContent = label(i);
              btns[i].classList.toggle('on', latched[i]);
              if (latched[i]) {
                var sm = document.createElement('small');
                sm.textContent = 'hold';
                btns[i].appendChild(sm);
              }
            }
          }
          function releaseAll() {
            for (var i = 0; i < 6; i++) {
              if (latched[i]) { up(cfg[i].k.toLowerCase(), cfg[i].s); latched[i] = false; }
            }
          }

          cfg.forEach(function (c, i) {
            var b = document.createElement('button');
            btns.push(b);
            b.addEventListener('pointerdown', function (e) {
              e.preventDefault();
              var k = cfg[i].k.toLowerCase(), s = cfg[i].s;
              var now = Date.now();
              if (latched[i]) {                       // tap while holding -> release
                up(k, s); latched[i] = false; lastTap[i] = 0;
              } else if (now - lastTap[i] < 350) {    // double tap -> hold
                down(k, s, false); latched[i] = true; lastTap[i] = 0;
              } else {                                // single tap -> one press
                down(k, s, true); up(k, s); lastTap[i] = now;
              }
              refresh();
            });
            b.addEventListener('contextmenu', function (e) { e.preventDefault(); });
            bar.appendChild(b);
          });

          var gear = document.createElement('button');
          gear.className = 'mk-gear';
          gear.textContent = '⚙';
          var panel = null;
          gear.addEventListener('click', function () {
            if (panel) { panel.remove(); panel = null; return; }
            releaseAll(); refresh();
            panel = document.createElement('div');
            panel.id = 'mkcfg';
            panel.appendChild(document.createTextNode('Buttons (tap = press, double tap = hold)'));
            cfg.forEach(function (c, i) {
              var row = document.createElement('div');
              row.className = 'row';
              var n = document.createElement('span'); n.textContent = (i + 1) + ':';
              var sel = document.createElement('select');
              KEYS.forEach(function (k) {
                var o = document.createElement('option'); o.value = k; o.textContent = k;
                if (k === c.k) o.selected = true;
                sel.appendChild(o);
              });
              sel.addEventListener('change', function () { cfg[i].k = sel.value; save(); refresh(); });
              var lab = document.createElement('label');
              var cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = !!c.s;
              cb.addEventListener('change', function () { cfg[i].s = cb.checked; save(); refresh(); });
              lab.appendChild(cb); lab.appendChild(document.createTextNode('Shift'));
              row.appendChild(n); row.appendChild(sel); row.appendChild(lab);
              panel.appendChild(row);
            });
            var done = document.createElement('button');
            done.className = 'done'; done.textContent = 'OK';
            done.addEventListener('click', function () { panel.remove(); panel = null; });
            panel.appendChild(done);
            document.body.appendChild(panel);
          });
          bar.appendChild(gear);

          document.body.appendChild(bar);
          document.body.classList.add('mk-pad');
          refresh();
        }

        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', build);
        else build();
      })();
    </script>
    <style>html,body{-webkit-text-size-adjust:none;text-size-adjust:none;overflow-x:hidden}*{touch-action:manipulation}</style>

<script>
  // We use an IE only document variable to check here to force it to show the browser warning.
  // For some reason, IE really does *not* want to cooperate, even when you have a file as a <script> that you load
  // in the body.
  // Other browsers will be checked whenever window.onload is ran.
  if (document.documentMode) {
    document.getElementById("loading").style.display = "none";
    document.getElementById("browser-warning").style.display = "flex";
  }
</script>
<script>
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});

</script>
