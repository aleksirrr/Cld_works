name: Build and publish to GitHub Pages

# One-time setup in your repo: Settings -> Pages -> Source: "GitHub Actions".
# Then push to main/master (or press "Run workflow") and the game appears at
# https://<your-name>.github.io/<repo>/  -- open it on the phone and use
# "Add to Home screen" / "Install app".

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same Node version the upstream project's own CI uses for this codebase.
      - uses: actions/setup-node@v4
        with:
          node-version: '14'
          cache: 'npm'
      - run: npm ci
      - name: Build
        shell: bash
        run: |
          set +e
          npm run build:release 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # Surface the real webpack errors as a readable annotation (not just the stack trace)
            grep -nE -B1 -A6 'ERROR in|Module not found|Can.t resolve|Module build failed|SyntaxError|ReferenceError|error  in|Failed to compile|JavaScript heap|ENOSPC|ENOMEM' build.log | head -c 3500 | sed ':a;N;$!ba;s/\n/%0A/g' > errs.txt
            echo "::error title=Build errors::$(cat errs.txt)"
            echo "--- tail of build.log ---"; tail -n 60 build.log
          fi
          exit $code
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
