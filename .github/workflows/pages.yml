name: Build and publish to GitHub Pages

# One-time setup in your repo: Settings -> Pages -> Source: "GitHub Actions".
# Then push to main/master (or press "Run workflow") and the game appears at
# https://<your-name>.github.io/<repo>/  -- open it on the phone and use
# "Add to Home screen" / "Install app".

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same Node version the upstream project's own CI uses for this codebase.
      - uses: actions/setup-node@v4
        with:
          node-version: '14'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:release
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
